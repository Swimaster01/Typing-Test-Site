<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="">
          <h4>Typing Speed Test</h4>
          <p>Type as fast as you can in 60 seconds!</p>
        </a>

        <div>
          <span> Trophy Icon </span>
          <span> Personal best: </span>
          <span> 0 WPM </span>
        </div>
      </nav>
    </header>
    <main>
      <div>
        <section class="stats">

          <p>WPM: <span id="wpm-display"> 0 </span></p>

          <p>Accuracy: <span id="accuracy-display"> 100% </span></p>

          <p>Time: <span id="timer-display"> 0:60 </span></p>

        </section>
        <section class="mode">

          <div class="difficulty">

            <p>Difficulty:</p>

            <button class="difficulty-btn" data-difficulty="easy">Easy</button>

            <button class="difficulty-btn" data-difficulty="medium">Medium</button>

            <button class="difficulty-btn" data-difficulty="hard">Hard</button>

          </div>

          <div class="option">

            <p>Mode:</p>

            <button class="mode-btn" data-mode="timed">Timed (60S)</button>

            <button class="mode-btn" data-mode="passage">Passage</button>

          </div>

        </section>
      </div>

      <section class="paragraph">
        <p id="passage-display"></p>
      </section>
      
      

      <section class="button">
        <button id="restart-btn">Restart Test</button>
      </section>
    </main>
  </body>
  <script src="/script.js"></script>
</html>
